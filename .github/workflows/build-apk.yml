name: Build Piano Master APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: |
          for i in 1 2 3; do
            echo "Attempt $i: running gradle assembleDebug..."
            if gradle --no-daemon assembleDebug --stacktrace; then
              echo "Build succeeded on attempt $i!"
              exit 0
            fi
            echo "Attempt $i failed. Retrying in 10s..."
            sleep 10
          done
          echo "Build failed after 3 attempts."
          exit 1
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Piano-Master-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
